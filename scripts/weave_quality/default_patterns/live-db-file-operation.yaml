id: live-db-file-operation
language: bash
violation_type: code:live-db-file-operation
message: "rm/mv/cp on the live SQLite database or its -wal/-shm files. A file-level swap under an open connection leaves foreign WAL frames that corrupt the graph; change the live database only through SQLite (.backup/.restore). Sanctioned sites (the load installer, init --force) are dispositioned findings, not exemptions in this rule."
severity: warning
rule:
  kind: command
  all:
    - has: {kind: command_name, regex: '^(rm|mv|cp)$'}
    # $WV_DB itself or any -wal/-shm sibling; $WV_DB.ensured is a marker file.
    - has: {regex: '^"?\$\{?WV_DB\}?(-wal|-shm)?"?$|(-wal|-shm)"?$'}
ignores:
  - "**/tests/**"
