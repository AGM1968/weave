id: git-listing-rename-blind
language: bash
violation_type: code:rename-blind-listing
message: "Porcelain git diff/log/show path listing without --no-renames. With rename detection (git's default) a rename lists only the new path, and a --diff-filter drops it from A/M sets, so the old path never reaches routing, pinning or linting. Add --no-renames where the old path decides the outcome; disposition the finding where following renames is intended (churn, history)."
severity: warning
rule:
  kind: command
  all:
    # has: with field: argument inspects only the FIRST argument, so match
    # direct-child words instead.
    - has: {kind: command_name, regex: '^git$'}
    - has: {kind: word, regex: '^(diff|log|show|whatchanged)$'}
    - has: {kind: word, regex: '^--(name-only|name-status|diff-filter(=.*)?)$'}
    - not: {has: {kind: word, regex: '^--no-renames$'}}
ignores:
  - "**/tests/**"
