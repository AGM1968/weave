id: lookup-skips-beside-self
language: bash
violation_type: code:vacuous-verification
message: "Candidate lookup loop reaches an installed copy (~/.local/lib/weave, ~/.local/bin/wv) with no candidate relative to the script itself. Run from a checkout, it executes the INSTALLED code, so a suite or gate goes green against the wrong copy. Put the beside-self path (dirname of BASH_SOURCE) first."
severity: warning
rule:
  kind: for_statement
  all:
    # Loop VALUES only: do_group is also a direct child, and a path merely
    # mentioned in the body is not a lookup order.
    - has: {any: [{kind: string}, {kind: concatenation}, {kind: word}], regex: '\.local/(lib/weave|bin/wv)'}
    - not: {has: {any: [{kind: string}, {kind: concatenation}, {kind: word}], regex: 'BASH_SOURCE|dirname "?\$0'}}
ignores:
  - "**/tests/**"
