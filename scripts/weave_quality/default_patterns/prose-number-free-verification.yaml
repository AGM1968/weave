id: prose-number-free-verification
language: prose
kind: motif
severity: info
policy: always-on-shared
maturity: promotable
provenance: >-
  wv-51f327@nowcastr.
message: >-
  When the same verification term occurs at least three times in a file, flag each occurrence with no digit within 80
  characters in its reflowed paragraph. Attach the local measured quantity or drop the reassurance term.
paths:
  - "docs/*.md"
  - "docs/**/*.md"
  - "*.md"
min_count: 3
require_no_digit_within: 80
terms:
  - measured
  - verified
  - validated
  - calibrated
  - proven
  - independent
  - already
positive_controls:
  - "The result was measured carefully. It was measured again. A final measured result followed."
negative_controls:
  - "The rate was measured at 5/min. The error was measured at 2%. Coverage was measured over 30 days."
