# Authoring templates: what a consumer repository needs in order to WRITE one of
# the things Weave otherwise only delivers.
#
# Weave installs guides, procedures and rules into a consumer. Until this
# manifest existed it templated nothing a consumer could author against, which
# is why two unrelated consumer repositories independently built the same guide
# tooling upstream did not have.
#
# One row per file. Adding a class is a template file plus a row here; the
# seeding loop in wv-init-repo reads this and knows nothing about guides.
#
#   <template path, relative to this directory>|<destination, relative to the repo root>|<mode>|<note>
#
# mode=seed     written only when the destination is absent. For anything the
#               consumer edits: --update must never clobber authored work.
# mode=refresh  written when absent, and rewritten on --update or --force. For
#               reference material that should not go stale.
#
# A destination must stay clear of every name the runtime resolves. A guide
# template landing on a package guide's basename would shadow it silently, which
# is the failure `wv doctor`'s guide-shadow advisory exists to report -- and prose
# ABOUT a class belongs beside its directory, not inside it, so that globbing the
# directory never turns up something that is not a guide.
guides/README.md|.weave/guides.README.md|refresh|the guide contract: resolution order, the closed section vocabulary, and how a local section name is promoted
guides/example-violation.md|.weave/guides/example-violation.md|seed|a working guide to copy; its id is not in the vocabulary, so it resolves for nothing
