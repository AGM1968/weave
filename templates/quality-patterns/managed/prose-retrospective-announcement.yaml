id: prose-retrospective-announcement
language: prose
kind: regex
violation_type: prose:work-context-leakage
severity: info
policy: always-on-shared
maturity: promotable
provenance: >-
  wv-1accdd in a consumer graph (2026-07-18), ported and retained by a second consumer. A retrospective achievement
  announcement was removed from stakeholder prose in favor of the current technical fact. Corpus-supported 2026-09-02
  (wv-f3a558): zero occurrences in 986,291 words of peer-reviewed papers, against 0.72 per 10,000 in this repository.
  Absent from published writing and present in ours, which is the strongest evidence a prohibition can carry.
message: >-
  Retrospective announcement assumes a before-and-after reference point the
  reader does not share. State the current fact directly.
paths:
  - "docs/*.md"
  - "docs/**/*.md"
  - "*.md"
patterns:
  - '\bnow (exists?|available|possible|live|in place|operational|unlocked|resolved)\b'
  - '\bwe now have\b'
positive_controls:
  - "The endpoint now exists."
negative_controls:
  - "The currently operational endpoint serves 5 regions."
  - "The present inventory contains three endpoints."
