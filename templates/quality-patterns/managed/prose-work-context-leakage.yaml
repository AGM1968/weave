id: prose-work-context-leakage
language: prose
kind: regex
violation_type: prose:work-context-leakage
severity: info
policy: always-on-shared
maturity: promotable
provenance: >-
  wv-cc46cc and wv-61b858 in a consumer graph, ported and retained by a second consumer. Chat artifacts and session deixis
  survived into documents even though their readers share neither context. Corpus-supported 2026-09-02 (wv-f3a558):
  zero occurrences in 986,291 words of peer-reviewed papers, against 1.99 per 10,000 in this repository. A
  construction published technical writing never uses is the strongest case a prohibition can have, and the rule is
  load-bearing here rather than inert.
message: >-
  Working-context leakage refers to the chat, session, or update that produced
  the document. Describe the work product rather than its conversation.
paths:
  - "docs/*.md"
  - "docs/**/*.md"
  - "*.md"
patterns:
  - '\bI hope this helps\b'
  - '\blet me know if\b'
  - '\bwould you like me to\b'
  - '\bas of my last (update|training)\b'
  - '\bbased on available information\b'
  - '\bthis session\b'
  - '\bthis conversation\b'
  - '\bthis chat\b'
  - '\b(from|into) this (chat|thread)\b'
  - '\banything (else )?you (want|need|would like)\b'
  - '\b(back to|into) your (systems?|repo|editor)\b'
positive_controls:
  - "This session produced the result."
  - "Copy from this chat into a file."
  - "Anything you want adjusted before you take it."
  - "Getting this back to your systems as Markdown."
negative_controls:
  - "The session token expires after 30 minutes."
  - "The conversation protocol records three message types."
  - "The editor renders the repository file."
